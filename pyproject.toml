[project]
name = "corematch-logistics"
version = "0.1.0"
description = "High-performance dual-resource allocation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fastmcp>=2.12.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
    "pyroaring>=1.1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
