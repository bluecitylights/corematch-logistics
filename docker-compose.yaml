services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /app/data/corematch.duckdb
    volumes:
      - db_data:/app/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "mcp_server.py", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      COREMATCH_API_URL: http://app:8000
    ports:
      - "8001:8001"
    depends_on:
      app:
        condition: service_healthy
    restart: on-failure

  mongodb:
    image: mongo:7
    volumes:
      - librechat_mongo:/data/db
    restart: on-failure

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    environment:
      MONGO_URI: mongodb://mongodb:27017/librechat
      CONFIG_PATH: /app/librechat.yaml
      HOST: 0.0.0.0
      PORT: 3080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CREDS_KEY: ${CREDS_KEY:?Set CREDS_KEY in .env}
      CREDS_IV: ${CREDS_IV:?Set CREDS_IV in .env}
      ALLOW_REGISTRATION: "true"
      #OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_KEY: ${GOOGLE_API_KEY}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - mcp
    restart: on-failure

volumes:
  db_data:
  librechat_mongo:
  librechat_images:
