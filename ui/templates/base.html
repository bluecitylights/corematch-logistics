<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CoreMatch-Logistics{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    .htmx-indicator { opacity: 0; transition: opacity 200ms; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
  <script>
    function setLocationId(input) {
      const option = Array.from(document.getElementById(input.getAttribute("list")).options)
        .find(item => item.value === input.value);
      input.form.elements[input.dataset.locationField].value = option?.dataset.locationId || "";
    }

    function closeSidePanel() {
      document.getElementById("side-panel").classList.add("hidden");
      document.getElementById("side-panel-content").innerHTML = "";
    }

    document.addEventListener("htmx:afterSwap", event => {
      if (event.detail.target.id === "side-panel-content") {
        document.getElementById("side-panel").classList.remove("hidden");
      }
    });
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- Nav -->
  <nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-bold text-lg tracking-tight">🚚 CoreMatch</a>
      <a href="/drivers"  class="hover:text-indigo-200 transition-colors">Drivers</a>
      <a href="/vehicles" class="hover:text-indigo-200 transition-colors">Vehicles</a>
      <a href="/orders"   class="hover:text-indigo-200 transition-colors">Orders</a>
      <a href="/locations" class="hover:text-indigo-200 transition-colors">Locations</a>
      <a href="/plans" class="hover:text-indigo-200 transition-colors">Plans</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <div id="side-panel" class="hidden fixed inset-0 z-50">
    <button type="button" onclick="closeSidePanel()"
      class="absolute inset-0 bg-black/30 cursor-default" aria-label="Close side panel"></button>
    <aside class="absolute right-0 top-0 h-full w-full max-w-xl overflow-y-auto bg-gray-50 shadow-2xl">
      <div id="side-panel-content"></div>
    </aside>
  </div>

</body>
</html>
