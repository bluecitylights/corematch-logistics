{% extends "base.html" %}
{% block title %}Vehicles — CoreMatch-Logistics{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-6">Vehicles</h1>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

  <!-- Table -->
  <div class="lg:col-span-2 bg-white rounded-xl shadow overflow-hidden">
    <div id="vehicles-table">
      {% include "partials/vehicles.html" %}
    </div>
  </div>

  <!-- Add form -->
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-base font-semibold mb-4">Add Vehicle</h2>
    <form
      hx-post="/vehicles"
      hx-target="#vehicles-table"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()"
      class="space-y-3">
      <div>
        <label class="block text-xs text-gray-500 mb-1">Vehicle ID</label>
        <input name="vehicle_id" required placeholder="VEH-005"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">License Plate</label>
        <input name="license_plate" required placeholder="ZZ-99-ZZ"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Location</label>
        <input name="location" required placeholder="Rotterdam"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div class="flex gap-4 pt-1">
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" name="spec_liftgate" value="on" class="rounded" />
          Liftgate
        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" name="spec_refrigerated" value="on" class="rounded" />
          Refrigerated
        </label>
      </div>
      <button type="submit"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm transition-colors">
        Add Vehicle
      </button>
    </form>
  </div>

</div>
{% endblock %}
